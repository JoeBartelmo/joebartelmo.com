title: Joe Bartelmo
tagline: "Blog and personal development website"
description: "Blog and personal development website. Home DIY, Computing Security, DevSecOps"
avatar: "/assets/images/me2.jpg"
paginate: 5
paginate_path: "/page:num/"
baseurl: ""
url: "https://joebartelmo.com"

# Theme configuration
theme: jekyll-theme-chirpy
lang: en
timezone: America/New_York

# Author and profile defaults
author:
  name: Joe Bartelmo
  email: joebartelmo@gmail.com
  avatar: "/assets/images/me2.jpg"
  url: "https://joebartelmo.com"

github:
  username: joebartelmo

social:
  name: Joe Bartelmo
  email: joebartelmo@gmail.com
  links:
    - "https://github.com/joebartelmo"
    - "https://www.linkedin.com/in/joebartelmo"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate
  - jekyll-include-cache
  - jemoji

whitelist:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate
  - jemoji

permalink: /:title/
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
lsi: false
excerpt_separator: "\n\n"
incremental: false

include:
  - _pages
  - _posts
  - _computer_vision
  - _development
  - _diy

exclude:
  - .tmp_shed_previews

# Collections
collections:
  diy:
    output: true
    permalink: /:collection/:path/
  security:
    output: true
    permalink: /:collection/:path/
  computer_vision:
    output: true
    permalink: /:collection/:path/
  development:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      pin: false

  - scope:
      path: ""
      type: pages
    values:
      layout: page
      toc: true

  - scope:
      path: ""
      type: diy
    values:
      layout: page
      toc: true

  - scope:
      path: ""
      type: computer_vision
    values:
      layout: page
      toc: true

  - scope:
      path: ""
      type: development
    values:
      layout: page
      toc: true

# Chirpy archive configuration
jekyll_archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /:name/
    tag: /tags/:name/

compress_html:
  clippings: all
  ignore:
envs: development
